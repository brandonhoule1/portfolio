name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:quality
      - name: Retain private diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
