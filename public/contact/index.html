<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Contact Brandon Houle about technology leadership, engineering, and practical AI enablement."><meta name="author" content="Brandon Houle"><link rel="canonical" href="https://brandonhoule.com/contact/">
<meta property="og:type" content="website"><meta property="og:title" content="Contact | Brandon Houle"><meta property="og:description" content="Send Brandon Houle a message."><meta property="og:url" content="https://brandonhoule.com/contact/">
<title>Contact | Brandon Houle</title><link rel="stylesheet" href="/site.css"></head><body><!--SITE_HEADER--><main class="page-main contact-page"><section class="page-intro"><p class="eyebrow">CONTACT</p><h1>Send a message.</h1><p class="section-lede">Use the form below. Your reply address is used only to respond to your message.</p></section>
<form class="contact-form" id="contact-form" action="/api/contact" method="post">
<div class="contact-honeypot" aria-hidden="true"><label for="company">Leave this field empty</label><input id="company" name="company" tabindex="-1" autocomplete="off"></div>
<label for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="100" required>
<label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<label for="subject">Subject</label><input id="subject" name="subject" maxlength="120" required>
<label for="message">Message</label><textarea id="message" name="message" maxlength="5000" required></textarea>
<!--TURNSTILE_WIDGET-->
<button class="button" type="submit">Send message</button><p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
</form><p class="note">You can also reach me through <a href="https://www.linkedin.com/in/brandon-houle">LinkedIn</a>.</p></main><!--SITE_FOOTER-->
<script>
const form=document.querySelector('#contact-form');const status=document.querySelector('#contact-status');
form.addEventListener('submit',async event=>{event.preventDefault();if(form.dataset.turnstileEnabled==='true'&&!form.querySelector('[name="cf-turnstile-response"]')?.value){status.textContent='Please complete the bot check before sending.';return;}status.textContent='Sending…';const button=form.querySelector('button');button.disabled=true;try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{accept:'application/json'}});const result=await response.json();if(!response.ok)throw new Error(result.message||'Message could not be sent.');form.reset();status.textContent='Thanks. Your message has been sent.';}catch(error){status.textContent=error.message||'Message could not be sent. Please try LinkedIn.';}finally{button.disabled=false;}});
</script></body></html>
